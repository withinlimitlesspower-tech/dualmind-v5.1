<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Manager Studio</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createSession()">
                    + New Chat
                </button>
            </div>
            <div class="sessions-list" id="sessions-list">
                <!-- Sessions will be loaded here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <button onclick="toggleSidebar()" style="background: none; border: none; color: #e2e8f0; cursor: pointer; font-size: 20px; display: none;" class="mobile-menu-btn">
                        ☰
                    </button>
                    <h1 id="session-title">AI Code Manager Studio</h1>
                </div>
                <div class="header-actions">
                    <button class="github-btn" id="github-btn" onclick="pushToGitHub()">
                        Push to GitHub
                    </button>
                </div>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will be loaded here -->
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <!-- Input -->
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input
                        type="text"
                        class="chat-input"
                        id="chat-input"
                        placeholder="Ask me to generate code..."
                        autofocus
                    />
                    <button class="send-btn" onclick="sendMessage()">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
